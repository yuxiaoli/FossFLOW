name: Deploy develop to Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_URL: /FossFLOW/
    steps:
      - name: Check out develop
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
        env:
          CI: "true"
      - name: Build library and app
        run: npm run build
        env:
          CI: "false"
      - name: Verify static export
        run: |
          test -f packages/fossflow-app/build/index.html
          touch packages/fossflow-app/build/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/fossflow-app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check out the deployed commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js for live verification
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install verification dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download the exact Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages-artifact
      - name: Extract the deployed files
        run: |
          mkdir .pages-export
          tar -xf .pages-artifact/artifact.tar -C .pages-export
      - name: Verify live assets, editor and offline cache isolation
        working-directory: packages/fossflow-app
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_ROOT: ${{ github.workspace }}/.pages-export
          DEPLOYED_HEAD: ${{ github.sha }}
        run: node scripts/verify-pages.mjs
      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-verification
          path: packages/fossflow-app/qa-results
          if-no-files-found: ignore
